name: Meta-harness

# Validates the live, running system after a deploy — not the code, the
# actual deployed thing. Reports pass/fail clearly; does NOT roll anything
# back (the deploy already happened by the time this runs). Called from
# deploy.yml once per environment:
#   - verify-staging: Staging container, without the "Trade history not
#     wiped" check (Staging's history is wiped on purpose every deploy), and
#     recording Staging's trade-history row count as a baseline.
#   - meta-harness: Production, with every check, exactly as before Staging
#     existed.
# Only runs when called; it has no push trigger of its own.

on:
  workflow_call:
    inputs:
      environment:
        description: "Name used in the job summary and email (Staging or Production)"
        required: true
        type: string
      container:
        description: "Container name on the EC2 host"
        required: true
        type: string
      env_file:
        description: "Env file on the EC2 host the container was started with"
        required: true
        type: string
      deployment_env:
        description: "DEPLOYMENT_ENV the container must report (staging or production)"
        required: true
        type: string
      dashboard_url:
        description: "Dashboard URL, fetched from the runner unless dashboard_from_host is set"
        required: true
        type: string
      dashboard_from_host:
        description: "Fetch the dashboard on the EC2 host via SSM (for a port open only to the owner's IP)"
        required: false
        default: false
        type: boolean
      check_history:
        description: "Run the 'Trade history not wiped' check"
        required: false
        default: true
        type: boolean
      hunt_history_before:
        description: "Pre-deploy hunt_history row count for the 'not wiped' check"
        required: false
        default: ""
        type: string
    outputs:
      failed_checks:
        description: "Comma-separated names of the checks that failed"
        value: ${{ jobs.checks.outputs.failed_checks }}
      hunt_history_count:
        description: "hunt_history row count read after the checks"
        value: ${{ jobs.checks.outputs.hunt_history_count }}

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout code

# Same deploy target as deploy.yml (a called workflow cannot read the
# caller's env, so these two are repeated here).
env:
  AWS_REGION: eu-north-1
  EC2_INSTANCE_ID: i-0180454c9417597f9
  CONTAINER: ${{ inputs.container }}

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      failed_checks: ${{ steps.evaluate.outputs.failed_checks }}
      hunt_history_count: ${{ steps.count.outputs.count }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::979667333506:role/GitHub-Action-Role
        aws-region: ${{ env.AWS_REGION }}

    # 1. Dashboard reachable.
    - name: Check dashboard is reachable
      id: dashboard
      continue-on-error: true
      env:
        DASHBOARD_URL: ${{ inputs.dashboard_url }}
        FROM_HOST: ${{ inputs.dashboard_from_host }}
      run: |
        if [ "$FROM_HOST" = "true" ]; then
          CODE=$(bash config/ci/ssm_run.sh "curl -sS -o /dev/null -w '%{http_code}' --max-time 15 '$DASHBOARD_URL/'")
        else
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$DASHBOARD_URL/")
        fi
        echo "HTTP $CODE from $DASHBOARD_URL"
        [ "$CODE" = "200" ]

    # 2. Config readback matches intent — catches "docker start didn't
    # reload .env" style drift between the host's env file and what the
    # live container actually resolved at startup, and checks the container
    # reports the expected environment marker.
    - name: Check config readback vs. live container
      id: config_drift
      continue-on-error: true
      env:
        ENV_FILE: ${{ inputs.env_file }}
        EXPECTED_DEPLOYMENT_ENV: ${{ inputs.deployment_env }}
      run: |
        bash config/ci/ssm_run.sh "CONTAINER='$CONTAINER' ENV_FILE='$ENV_FILE' EXPECTED_DEPLOYMENT_ENV='$EXPECTED_DEPLOYMENT_ENV'
        $(cat config/ci/check_config_drift.sh)"

    # 3. Engine actually running — not just the container "Up".
    - name: Check engine is actually running (engine_status freshness)
      id: engine_freshness
      continue-on-error: true
      run: bash config/ci/ssm_run.sh "docker exec $CONTAINER python3 config/ci/engine_freshness_check.py"

    # 4. No errors in fresh logs.
    - name: Check for errors in recent container logs
      id: logs
      continue-on-error: true
      run: |
        bash config/ci/ssm_run.sh "
          if docker logs $CONTAINER --tail 500 2>&1 | grep -iE 'error|exception|traceback|modulenotfound'; then
            echo 'Suspicious lines found in the last 500 log lines (see above)'
            exit 1
          fi
          echo 'No error/exception/traceback/ModuleNotFound lines in the last 500 log lines'
        "

    # 5. Trade history not accidentally wiped (skipped on Staging, whose
    # history is wiped on purpose every deploy).
    - name: Check hunt_history row count did not drop
      id: hunt_history
      if: inputs.check_history
      continue-on-error: true
      env:
        BEFORE: ${{ inputs.hunt_history_before }}
      run: |
        if [ -z "$BEFORE" ] || [ "$BEFORE" = "unknown" ]; then
          echo "No pre-deploy baseline available (first run after adding this check, or the baseline snapshot itself failed) — skipping comparison this time."
          exit 0
        fi
        AFTER=$(bash config/ci/ssm_run.sh "docker exec $CONTAINER python3 config/ci/count_hunt_history.py")
        AFTER=$(echo "$AFTER" | tr -d '[:space:]')
        echo "hunt_history rows: before=$BEFORE after=$AFTER"
        if [ "$AFTER" -lt "$BEFORE" ]; then
          echo "::error::hunt_history row count DROPPED ($BEFORE -> $AFTER) — trade history may have been wiped"
          exit 1
        fi
        echo "OK: hunt_history row count did not drop ($BEFORE -> $AFTER)"

    # Staging's trade-history row count after its checks: the baseline the
    # Production gate compares against before promoting. Informational, not
    # one of the checks.
    - name: Record hunt_history row count (baseline)
      id: count
      if: ${{ !inputs.check_history }}
      continue-on-error: true
      run: |
        COUNT=$(bash config/ci/ssm_run.sh "docker exec $CONTAINER python3 config/ci/count_hunt_history.py 2>/dev/null || echo unknown")
        COUNT=$(echo "$COUNT" | tr -d '[:space:]')
        echo "hunt_history rows: $COUNT" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "count=$COUNT" >> "$GITHUB_OUTPUT"

    # Summarize which specific check(s) failed — both for the Actions UI
    # (job summary) and to feed a specific, non-generic failure email.
    - name: Evaluate meta-harness results
      id: evaluate
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        CHECK_HISTORY: ${{ inputs.check_history }}
        R_DASHBOARD: ${{ steps.dashboard.outcome }}
        R_CONFIG: ${{ steps.config_drift.outcome }}
        R_ENGINE: ${{ steps.engine_freshness.outcome }}
        R_LOGS: ${{ steps.logs.outcome }}
        R_HISTORY: ${{ steps.hunt_history.outcome }}
      run: |
        echo "Meta-harness: $ENVIRONMENT" | tee -a "$GITHUB_STEP_SUMMARY"
        FAILED=""
        check() {
          label="$1"; outcome="$2"
          if [ "$outcome" = "success" ]; then
            echo "PASS: $label" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "FAIL: $label" | tee -a "$GITHUB_STEP_SUMMARY"
            FAILED="${FAILED}${FAILED:+, }${label}"
          fi
        }

        check "Dashboard reachable" "$R_DASHBOARD"
        check "Config readback matches intent" "$R_CONFIG"
        check "Engine actually running" "$R_ENGINE"
        check "No errors in fresh logs" "$R_LOGS"
        if [ "$CHECK_HISTORY" = "true" ]; then
          check "Trade history not wiped" "$R_HISTORY"
        fi

        echo "failed_checks=$FAILED" >> "$GITHUB_OUTPUT"
        if [ -n "$FAILED" ]; then
          echo "::error::$ENVIRONMENT meta-harness checks failed: $FAILED"
          exit 1
        fi
