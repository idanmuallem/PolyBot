name: Test, Build & Deploy PolyBot

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout code

# A newer push to main supersedes an older run: it cancels the older run
# whether it is still deploying or waiting on the Production approval / 24h
# timer, so Production only ever gets a version that ran a full day on
# Staging, and the 24 hours restart. Every other run (branch pushes, PRs)
# gets a group of its own, so it never cancels main's run or another run.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'deploy-main' || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: polybot/main
  EC2_INSTANCE_ID: i-0180454c9417597f9 # Your verified Stockholm Instance ID
  DASHBOARD_URL: http://16.171.179.213 # Elastic IP on the EC2 instance above

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install --no-cache-dir -r config/requirements-dev.txt

    - name: Lint with ruff
      run: ruff check --output-format=github .

    - name: Run test suite
      if: ${{ !cancelled() }}
      run: pytest

  # Path filter: decides whether a push to main touched runtime code.
  # Docs, Markdown, scripts/ and tests/-only pushes run `test` above and
  # stop there (build and every deploy job show as skipped, so no failure
  # email); anything else deploys. Plain git diff, no third-party action.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect runtime changes
      id: filter
      env:
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.sha }}
      run: |
        # No usable "before" commit (new branch, force-push to an unknown
        # commit): we can't tell what changed, so deploy to be safe.
        if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          echo "No usable before-commit ($BEFORE) - treating as a runtime change"
          echo "runtime=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
        echo "Changed files:"
        echo "$CHANGED"
        RUNTIME=$(echo "$CHANGED" | grep -vE '^(docs/|scripts/|tests/)|\.md$' | grep -v '^$' || true)
        if [ -n "$RUNTIME" ]; then
          echo "Runtime files changed:"
          echo "$RUNTIME"
          echo "runtime=true" >> "$GITHUB_OUTPUT"
        else
          echo "Only docs/Markdown/scripts/tests changed - skipping deploy"
          echo "runtime=false" >> "$GITHUB_OUTPUT"
        fi

  # Build/push/deploy only for an actual push to main — a PR or a push to
  # any other branch runs the `test` job above (via the on.push/pull_request
  # triggers) and stops there, same as before this workflow grew a test job.
  #
  # Runtime pushes to main then go: build -> deploy-staging -> verify-staging
  # -> deploy-production -> meta-harness. Each job needs the one before, so a
  # failure anywhere (including a failed Staging check) stops Production.
  build:
    needs: [test, changes]
    # A custom `if:` on a job with `needs:` REPLACES the implicit success()
    # check GitHub would otherwise add — so `success()` has to be spelled
    # out here, or a failing `test` job would not actually block this one.
    # A skipped build also skips every job after it (they need it), so a
    # docs-only push shows them all as skipped and sends no failure email.
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::979667333506:role/GitHub-Action-Role
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -f config/Docker/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # Staging: a second container (`polybot-staging`, port 8502) on the same
  # instance, in Dry run with no wallet key and a fresh trade history every
  # deploy. Production's container is untouched. See config/ci/deploy_staging.sh.
  deploy-staging:
    needs: build
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::979667333506:role/GitHub-Action-Role
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Ensure EC2 instance is running
      run: bash config/ci/ensure_ec2_running.sh

    - name: Deploy Staging via AWS SSM
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
      run: |
        bash config/ci/ssm_run.sh "REGISTRY='$REGISTRY' IMAGE='$IMAGE' AWS_REGION='$AWS_REGION'
        $(cat config/ci/deploy_staging.sh)"

  # The meta-harness against Staging, without "Trade history not wiped"
  # (Staging's history is wiped on purpose). Its dashboard check runs on the
  # instance itself, since port 8502 is open only to the owner's IP. Also
  # records Staging's hunt_history row count (output hunt_history_count) as
  # the baseline for the Production gate.
  verify-staging:
    needs: deploy-staging
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/meta-harness.yml
    with:
      container: polybot-staging
      env_file: /home/ec2-user/.env.staging
      deployment_env: staging
      dashboard_url: http://localhost:8502
      dashboard_from_host: true
      check_history_not_wiped: false
      record_baseline: true

  # Production deploys only after Staging passed, and runs the same
  # SHA-tagged image Staging ran. The `production` GitHub environment holds
  # the job until the owner approves and a 24-hour wait timer has run out
  # (repo admins may bypass the timer in an emergency; see README,
  # Deployment > Production gate). Its first step then checks Staging's
  # trade history did not shrink during those 24 hours.
  deploy-production:
    needs: verify-staging
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.DASHBOARD_URL }}
    outputs:
      hunt_history_before: ${{ steps.pre_snapshot.outputs.count }}
      failed_checks: ${{ steps.gate_result.outputs.failed_checks }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::979667333506:role/GitHub-Action-Role
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Ensure EC2 instance is running
      run: bash config/ci/ensure_ec2_running.sh

    # The Production gate: Staging still runs this commit's image and its
    # hunt_history row count is not below the baseline verify-staging
    # recorded. See config/ci/check_staging_history.sh.
    - name: Check Staging history did not shrink
      id: staging_history
      env:
        BASELINE: ${{ needs.verify-staging.outputs.hunt_history_count }}
        IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
      run: |
        bash config/ci/ssm_run.sh "BASELINE='$BASELINE' IMAGE='$IMAGE'
        $(cat config/ci/check_staging_history.sh)"

    # Names the gate in the failure email (notify-failure reads this output).
    - name: Report Production gate failure
      id: gate_result
      if: failure() && steps.staging_history.outcome == 'failure'
      run: echo "failed_checks=Staging history did not shrink" >> "$GITHUB_OUTPUT"

    # Baseline for the post-deploy meta-harness's "trade history not wiped"
    # check (see the meta-harness job below). Best-effort: the container
    # from the *previous* deploy is what's still running at this point, so
    # on the very first deploy after this script was added it won't exist
    # there yet — that's fine, the comparison step just skips itself when
    # no baseline came through.
    - name: Snapshot hunt_history row count (pre-deploy baseline)
      id: pre_snapshot
      continue-on-error: true
      run: |
        COUNT=$(bash config/ci/ssm_run.sh "docker exec polybot python3 config/ci/count_hunt_history.py 2>/dev/null || echo unknown")
        COUNT=$(echo "$COUNT" | tr -d '[:space:]')
        echo "Pre-deploy hunt_history rows: $COUNT"
        echo "count=$COUNT" >> "$GITHUB_OUTPUT"

    # The wal_checkpoint.py line below (before `docker stop`) flushes
    # trades.db's WAL sidecar to the host-visible file while the old
    # container can still reach it — trades.db is bind-mounted as a single
    # file (not a directory), so the *-wal holding not-yet-checkpointed
    # writes lives only in the old container's own filesystem and would
    # otherwise be destroyed, unflushed, by `docker rm`. Discovered via the
    # meta-harness's "Trade history not wiped" check catching a real
    # hunt_history row-count drop on an ordinary deploy.
    #
    # The container runs the image tagged with this commit's SHA, not
    # `:latest`, so `docker ps` shows exactly which build is running. The prune
    # is `docker image prune -a`, not `docker system prune -a`: it removes
    # only images no container uses, so it never deletes the image another
    # running container (e.g. Staging) is on.
    - name: Deploy to EC2 via AWS SSM
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploying PolyBot to Stockholm" \
          --parameters 'commands=[
            "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
            "docker exec polybot python3 config/ci/wal_checkpoint.py || true",
            "docker stop polybot || true",
            "docker rm polybot || true",
            "docker image prune -a -f",
            "docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}",
            "touch /home/ec2-user/trades.db",
            "chmod 666 /home/ec2-user/trades.db",
            "mkdir -p /home/ec2-user/paper_trading",
            "chmod 777 /home/ec2-user/paper_trading",
            "docker run -d --name polybot --restart always --log-opt max-size=20m --log-opt max-file=3 -p 80:8501 -v /home/ec2-user/trades.db:/app/trades.db -v /home/ec2-user/paper_trading:/app/paper_trading --env-file /home/ec2-user/.env ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          ]' \
          --query 'Command.CommandId' --output text)
        echo "SSM command ID: $COMMAND_ID"

        # send-command only confirms the command was queued — it says nothing about
        # whether the remote script actually ran. Poll get-command-invocation for the
        # real outcome so a stuck/failed deploy fails this job instead of looking green.
        MAX_ATTEMPTS=90
        SLEEP_SECONDS=10
        STATUS="InProgress"
        for i in $(seq 1 "$MAX_ATTEMPTS"); do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query 'Status' --output text 2>/dev/null || echo "Pending")
          echo "[$i/$MAX_ATTEMPTS] status=$STATUS"
          case "$STATUS" in
            Success|Failed|Cancelled|TimedOut) break ;;
          esac
          sleep "$SLEEP_SECONDS"
        done

        echo "--- remote stdout ---"
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" --instance-id "${{ env.EC2_INSTANCE_ID }}" \
          --query 'StandardOutputContent' --output text || true
        echo "--- remote stderr ---"
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" --instance-id "${{ env.EC2_INSTANCE_ID }}" \
          --query 'StandardErrorContent' --output text || true

        if [ "$STATUS" != "Success" ]; then
          echo "::error::SSM deploy command did not succeed (final status: $STATUS)"
          exit 1
        fi
        echo "Deploy command completed successfully."

  # Production meta-harness: every check, as before Staging existed.
  meta-harness:
    needs: deploy-production
    # Same `success()` note as the build job above — required here too.
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/meta-harness.yml
    with:
      container: polybot
      env_file: /home/ec2-user/.env
      deployment_env: production
      dashboard_url: http://16.171.179.213 # Elastic IP on the EC2 instance
      hunt_history_before: ${{ needs.deploy-production.outputs.hunt_history_before }}

  # One email for any failed job in the run. Backup to GitHub's own "failed
  # workflow" email (repo owner's Settings → Notifications → Actions), which
  # is per-user and can be muted — the 2026-09-30 run of five failed deploys
  # went unnoticed because only the meta-harness emailed. To cover a new job
  # (Staging, Production gate, ...), add it to `needs` below; the failed-job
  # list is derived from `needs` generically, nothing else to change.
  notify-failure:
    needs: [test, changes, build, deploy-staging, verify-staging, deploy-production, meta-harness]
    # failure() on a job is true when any job in `needs` failed. Skipped jobs
    # (PRs, non-main pushes) and cancelled runs (superseded by a newer push)
    # do not count as failures, so they send nothing.
    if: failure()
    runs-on: ubuntu-latest
    steps:
    - name: Name the failed job(s)
      id: summary
      env:
        NEEDS: ${{ toJSON(needs) }}
        STAGING_CHECKS: ${{ needs.verify-staging.outputs.failed_checks }}
        GATE_CHECKS: ${{ needs.deploy-production.outputs.failed_checks }}
        PRODUCTION_CHECKS: ${{ needs.meta-harness.outputs.failed_checks }}
      run: |
        FAILED_JOBS=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')
        FAILED_CHECKS=""
        if [ -n "$STAGING_CHECKS" ]; then
          FAILED_CHECKS="Staging: $STAGING_CHECKS"
        fi
        if [ -n "$GATE_CHECKS" ]; then
          FAILED_CHECKS="${FAILED_CHECKS}${FAILED_CHECKS:+; }Production gate: $GATE_CHECKS"
        fi
        if [ -n "$PRODUCTION_CHECKS" ]; then
          FAILED_CHECKS="${FAILED_CHECKS}${FAILED_CHECKS:+; }Production: $PRODUCTION_CHECKS"
        fi
        SUBJECT="PolyBot CI FAILED: ${FAILED_JOBS:-unknown job}"
        if [ -n "$FAILED_CHECKS" ]; then
          SUBJECT="$SUBJECT ($FAILED_CHECKS)"
        fi
        echo "Failed job(s): $FAILED_JOBS" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "failed_jobs=$FAILED_JOBS" >> "$GITHUB_OUTPUT"
        echo "failed_checks=$FAILED_CHECKS" >> "$GITHUB_OUTPUT"
        echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"

    - name: Email failure
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.GMAIL_USERNAME }}
        password: ${{ secrets.GMAIL_APP_PASSWORD }}
        subject: ${{ steps.summary.outputs.subject }}
        to: idanmu17@gmail.com
        from: PolyBot CI <${{ secrets.GMAIL_USERNAME }}>
        body: |
          The PolyBot pipeline failed.

          Failed job(s): ${{ steps.summary.outputs.failed_jobs || 'unknown — check the run directly' }}
          Failed check(s): ${{ steps.summary.outputs.failed_checks || 'none reported' }}

          Commit: ${{ github.sha }} on ${{ github.ref_name }} (${{ github.event_name }})
          ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

          Nothing is rolled back automatically. If a deploy job failed, the
          deploy may be partial; if the meta-harness failed, the deploy already
          completed and the deployed system failed validation.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
